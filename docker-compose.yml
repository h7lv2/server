services:
  traefik:
    image: traefik:v3.7.5
    container_name: traefik
    entrypoint: /bin/sh -c 'sed "s|\\$${EMAIL}|${EMAIL}|g; s|\\$${CF_DNS_API_TOKEN}|${CF_DNS_API_TOKEN}|g" /traefik.yml > /etc/traefik/traefik.yml && exec traefik'
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2096:2096"
      - "2097:2097"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./traefik/acme:/etc/traefik/acme
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - EMAIL=${EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL=${EMAIL}
    networks: [backend]

  s-ui:
    image: alireza7/s-ui
    container_name: s-ui
    restart: unless-stopped
    ports:
      - "10000-10010:10000-10010"
      - "10000-10010:10000-10010/udp"
    volumes:
      - "./db_sui:/app/db"
    networks: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.s-ui.rule=Host(`${SUI_SUBDOMAIN}.${SUI_DOMAIN}`)
      - traefik.http.routers.s-ui.entrypoints=websecure
      - traefik.http.routers.s-ui.tls.certresolver=cloudflare
      - traefik.http.routers.s-ui.service=s-ui-web
      - traefik.http.services.s-ui-web.loadbalancer.server.port=2095
      - traefik.http.routers.s-ui-api-redirect.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.s-ui-api-redirect.entrypoints=s-ui-api-redirect
      - traefik.http.routers.s-ui-api-redirect.middlewares=s-ui-redirect-to-2097
      - traefik.http.routers.s-ui-api-redirect.service=noop@internal
      - traefik.http.middlewares.s-ui-redirect-to-2097.redirectscheme.scheme=https
      - traefik.http.middlewares.s-ui-redirect-to-2097.redirectscheme.port=2097
      - traefik.tcp.routers.s-ui-api.rule=HostSNI(`*`)
      - traefik.tcp.routers.s-ui-api.entrypoints=s-ui-api
      - traefik.tcp.routers.s-ui-api.tls.passthrough=true
      - traefik.tcp.routers.s-ui-api.service=s-ui-api
      - traefik.tcp.services.s-ui-api.loadbalancer.server.port=2097

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${VAULT_DATABASE_URL}
      - DOMAIN=https://${VAULT_SUBDOMAIN}.${PRIMARY_DOMAIN}
    volumes:
      - ./vw-data:/data
    networks: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`${VAULT_SUBDOMAIN}.${PRIMARY_DOMAIN}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=cloudflare
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80

  tranquil-pds:
    image: atcr.io/tranquil.farm/tranquil-pds:latest
    container_name: tranquil-pds
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DPOP_SECRET=${DPOP_SECRET}
      - MASTER_KEY=${MASTER_KEY}
      - BLOB_STORAGE_BACKEND=${BLOB_STORAGE_BACKEND}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DISABLE_ACCOUNT_VERIFICATION_GATE=${DISABLE_ACCOUNT_VERIFICATION_GATE}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_SMARTHOST_HOST=${MAIL_SMARTHOST_HOST}
      - MAIL_SMARTHOST_PORT=${MAIL_SMARTHOST_PORT}
      - MAIL_SMARTHOST_USERNAME=${MAIL_SMARTHOST_USERNAME}
      - MAIL_SMARTHOST_PASSWORD=${MAIL_SMARTHOST_PASSWORD}
      - MAIL_SMARTHOST_TLS=${MAIL_SMARTHOST_TLS}
    volumes:
      - ./tranquil/config.toml:/etc/tranquil-pds/config.toml:ro
      - ./tranquil/blobs:/var/lib/tranquil/blobs
    networks: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.tranquil-pds.rule=Host(`${PDS_SUBDOMAIN}.${PRIMARY_DOMAIN}`) || HostRegexp(`.+\.${PDS_SUBDOMAIN}\.${PRIMARY_DOMAIN}`)
      - traefik.http.routers.tranquil-pds.entrypoints=websecure
      - traefik.http.routers.tranquil-pds.tls.certresolver=cloudflare
      - traefik.http.routers.tranquil-pds.tls.domains[0].main=${PDS_SUBDOMAIN}.${PRIMARY_DOMAIN}
      - traefik.http.routers.tranquil-pds.tls.domains[0].sans=*.${PDS_SUBDOMAIN}.${PRIMARY_DOMAIN}
      - traefik.http.services.tranquil-pds.loadbalancer.server.port=3000

networks:
  backend:
    name: backend
    driver: bridge
