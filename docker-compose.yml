services:
  traefik:
    image: traefik:v3.7.5
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2096:2096"
      - "2097:2097"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/acme:/etc/traefik/acme
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - EMAIL=${EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL=${EMAIL}
    networks: [backend]

  s-ui:
    image: alireza7/s-ui
    container_name: s-ui
    restart: unless-stopped
    ports:
      - "10000-10010:10000-10010"
      - "10000-10010:10000-10010/udp"
    volumes:
      - "./db_sui:/app/db"
    networks: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.s-ui.rule=Host(`${SUI_SUBDOMAIN}.${SUI_DOMAIN}`)
      - traefik.http.routers.s-ui.entrypoints=websecure
      - traefik.http.routers.s-ui.tls.certresolver=cloudflare
      - traefik.http.routers.s-ui.service=s-ui-web
      - traefik.http.services.s-ui-web.loadbalancer.server.port=2095
      - traefik.http.routers.s-ui-api-redirect.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.s-ui-api-redirect.entrypoints=s-ui-api-redirect
      - traefik.http.routers.s-ui-api-redirect.middlewares=s-ui-redirect-to-2097
      - traefik.http.routers.s-ui-api-redirect.service=noop@internal
      - traefik.http.middlewares.s-ui-redirect-to-2097.redirectscheme.scheme=https
      - traefik.http.middlewares.s-ui-redirect-to-2097.redirectscheme.port=2097
      - traefik.tcp.routers.s-ui-api.rule=HostSNI(`*`)
      - traefik.tcp.routers.s-ui-api.entrypoints=s-ui-api
      - traefik.tcp.routers.s-ui-api.tls.passthrough=true
      - traefik.tcp.routers.s-ui-api.service=s-ui-api
      - traefik.tcp.services.s-ui-api.loadbalancer.server.port=2097

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/vaultwarden
      - DOMAIN=https://${VAULT_SUBDOMAIN}.${PRIMARY_DOMAIN}
    volumes:
      - ./vw-data:/data
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    labels:
      - traefik.enable=true
      - traefik.http.routers.vaultwarden.rule=Host(`${VAULT_SUBDOMAIN}.${PRIMARY_DOMAIN}`)
      - traefik.http.routers.vaultwarden.entrypoints=websecure
      - traefik.http.routers.vaultwarden.tls.certresolver=cloudflare
      - traefik.http.services.vaultwarden.loadbalancer.server.port=80

  shrimpnet:
    image: iceshrimp.dev/iceshrimp/iceshrimp.net:dev
    container_name: shrimpnet
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ICESHRIMP_CONFIG_OVERRIDES=/app/config/configuration.ini
    networks: [backend]
    volumes:
      - ./shrimpnet/data/media:/data/media
      - ./shrimpnet/config:/app/config:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.shrimpnet.rule=Host(`${ICESHRIMP_SUBDOMAIN}.${PRIMARY_DOMAIN}`)
      - traefik.http.routers.shrimpnet.entrypoints=websecure
      - traefik.http.routers.shrimpnet.tls.certresolver=cloudflare
      - traefik.http.services.shrimpnet.loadbalancer.server.port=3000

  db:
    image: postgres:15-alpine
    container_name: shared_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=${POSTGRES_MULTIPLE_DATABASES}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./postgres/init-db.sh:/usr/local/bin/init-db.sh:ro
    command: >
      sh -c "docker-entrypoint.sh postgres &
             until pg_isready -U $$POSTGRES_USER; do sleep 2; done;
             /usr/local/bin/init-db.sh;
             wait"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

networks:
  backend:
    name: backend
    driver: bridge
